name: veritrust_sdk
description: >
  VeriTrust AI — Dual-Core Deterministic Guardrail SDK for YONO 2.0.
  A pluggable Flutter overlay widget with built-in PII redaction,
  verified AI responses, and compliance-grade audit logging.
version: 0.1.0
homepage: https://github.com/sbi-yono/veritrust-sdk

environment:
  sdk: ^3.10.0-290.4.beta
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  flutter_markdown: ^0.7.6
  uuid: ^4.5.1
  record: ^6.2.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
